name: NumberMemo
options:
  developmentLanguage: en
  bundleIdPrefix: com.deaum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.29.3"

targets:
  NumberMemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NumberMemo
      - path: Shared
    dependencies:
      - package: GRDB
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deaum.numbermemo
        INFOPLIST_FILE: NumberMemo/Info.plist
        CODE_SIGN_ENTITLEMENTS: NumberMemo/NumberMemo.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.10"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEVELOPMENT_TEAM: 6HV24C77H5
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deaum.numbermemo.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: 6HV24C77H5
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  NumberMemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NumberMemoTests
    dependencies:
      - target: NumberMemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: 6HV24C77H5
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  NumberMemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NumberMemoUITests
    dependencies:
      - target: NumberMemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deaum.numbermemo.uitests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: 6HV24C77H5
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: NumberMemo

schemes:
  NumberMemo:
    build:
      targets:
        NumberMemo: all
    test:
      targets: [NumberMemoTests, NumberMemoUITests]
  NativeContentDeviceValidation:
    build:
      targets:
        NumberMemo: all
    test:
      targets: [NumberMemoTests, NumberMemoUITests]
      environmentVariables:
        NUMBER_MEMO_LIVE_TESTS: "1"
  BooruDeviceValidation:
    build:
      targets:
        NumberMemo: all
    test:
      targets: [NumberMemoTests, NumberMemoUITests]
      environmentVariables:
        NUMBER_MEMO_BOORU_LIVE_TESTS: "1"
        NUMBER_MEMO_LEGACY_SERVERS: "$(NUMBER_MEMO_LEGACY_SERVERS)"
